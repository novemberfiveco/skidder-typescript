name: Release @novemberfiveco/skidder-typescript
concurrency:
  group: publish-${{ github.github.base_ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
    inputs:
      type:
        type: choice
        description: 'Choose the release type'
        options:
          - patch
          - minor
          - major
        required: true
        default: patch
      dry:
        type: boolean
        description: Dry run release
        default: false

jobs:
  publish:
    if: github.repository == 'novemberfiveco/skidder-typescript' && github.ref == 'refs/heads/master'
    name: 'Publish'
    runs-on: ubuntu-latest
    permissions:
      # The built-in GITHUB_TOKEN only reads. The release App token below pushes and creates the release.
      contents: read
      # npm trusted publishing: npm publish authenticates with a GitHub OIDC token, not a stored npm token.
      id-token: write
    steps:
      # A one-hour token of the org's release GitHub App. The App may bypass the master protection,
      # so release-it can push the release commit. The token is revoked when the job ends.
      - name: Create release token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          registry-url: https://registry.npmjs.org/
          cache: 'npm'

      # Release commits come from the App's bot account, for example novemberfive-npm-release[bot].
      - name: Git Config
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Release
        run: npm run release -- --ci -V --increment $TYPE_ARG $DRY_ARG
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TYPE_ARG: ${{ inputs.type }}
          DRY_ARG: ${{ inputs.dry == true && '--dry-run' || '' }}
