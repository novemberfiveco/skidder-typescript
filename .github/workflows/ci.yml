name: Release @novemberfiveco/skidder-typescript
concurrency:
  group: publish-${{ github.github.base_ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
    inputs:
      type:
        type: choice
        description: 'Choose the release type'
        options:
          - patch
          - minor
          - major
        required: true
        default: patch
      dry:
        type: boolean
        description: Dry run release
        default: false

jobs:
  publish:
    if: github.repository == 'novemberfiveco/skidder-typescript' && github.ref == 'refs/heads/master'
    name: 'Publish'
    runs-on: ubuntu-latest
    permissions:
      # The built-in GITHUB_TOKEN pushes the release commit and tag and creates the GitHub release.
      contents: write
      # npm trusted publishing: npm publish authenticates with a GitHub OIDC token, not a stored npm token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          registry-url: https://registry.npmjs.org/
          cache: 'npm'

      - name: Git Config
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Release
        run: npm run release -- --ci -V --increment $TYPE_ARG $DRY_ARG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TYPE_ARG: ${{ inputs.type }}
          DRY_ARG: ${{ inputs.dry == true && '--dry-run' || '' }}
